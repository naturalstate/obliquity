<svg width="1120" height="420" viewBox="0 0 1120 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c11"/>
      <stop offset="55%" stop-color="#0d0f15"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#1a1d2b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prog" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="60%" stop-color="#c04dff"/>
      <stop offset="100%" stop-color="#ff8a1e"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5e3a"/>
      <stop offset="35%" stop-color="#ff8a1e"/>
      <stop offset="70%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1120" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1120" height="420" rx="20" fill="url(#glow)"/>
  <rect x="1" y="1" width="1118" height="418" rx="19" fill="none" stroke="#20222c" stroke-width="1.5"/>

  <!-- ============ LEFT COLUMN ============ -->

  <!-- wordmark -->
  <text x="58" y="132" font-size="78" font-weight="800" letter-spacing="-2">
    <tspan fill="#f4f6fb">Obli</tspan><tspan fill="url(#rainbow)">quity</tspan>
  </text>

  <!-- tagline -->
  <text x="60" y="188" font-size="27" font-weight="700" fill="#e8eaf0">Stage your recon. Never repeat a scan.</text>

  <!-- subtitle -->
  <text x="60" y="222" font-size="15.5" fill="#8b93a3">A project-aware orchestration layer over</text>
  <text x="60" y="244" font-size="15.5" fill="#8b93a3"><tspan fill="#c7cdda">feroxbuster</tspan>, <tspan fill="#c7cdda">ffuf</tspan>, and <tspan fill="#c7cdda">hashcat</tspan> &#8212; bust, fuzz, crack.</text>

  <!-- tool pills -->
  <g font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="14" font-weight="600">
    <g>
      <rect x="60" y="278" width="118" height="36" rx="18" fill="#14151d" stroke="#ff7a3c" stroke-width="1.4"/>
      <text x="119" y="301" text-anchor="middle" fill="#ffa26b">feroxbuster</text>
    </g>
    <g>
      <rect x="188" y="278" width="62" height="36" rx="18" fill="#14151d" stroke="#9d8fff" stroke-width="1.4"/>
      <text x="219" y="301" text-anchor="middle" fill="#b9aeff">ffuf</text>
    </g>
    <g>
      <rect x="260" y="278" width="92" height="36" rx="18" fill="#14151d" stroke="#2dd4bf" stroke-width="1.4"/>
      <text x="306" y="301" text-anchor="middle" fill="#5eead4">hashcat</text>
    </g>
    <g>
      <rect x="362" y="278" width="96" height="36" rx="18" fill="#14151d" stroke="#58a6ff" stroke-width="1.4"/>
      <text x="410" y="301" text-anchor="middle" fill="#83bcff">SecLists</text>
    </g>
    <g>
      <rect x="468" y="278" width="66" height="36" rx="18" fill="#14151d" stroke="#ffcc66" stroke-width="1.4"/>
      <text x="501" y="301" text-anchor="middle" fill="#ffd98a">Burp</text>
    </g>
  </g>

  <!-- progress row -->
  <text x="60" y="366" font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5" fill="#a78bfa">ASPNET-STANDARD</text>
  <rect x="222" y="352" width="258" height="12" rx="6" fill="#1b1c26"/>
  <rect x="222" y="352" width="188" height="12" rx="6" fill="url(#prog)"/>
  <text x="494" y="366" font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="13" font-weight="600" fill="#8b93a3">STAGE 3 / 4</text>

  <!-- ============ RIGHT COLUMN: fake terminal ============ -->
  <g filter="url(#soft)">
    <rect x="600" y="46" width="462" height="328" rx="14" fill="#0e1017"/>
    <rect x="600.75" y="46.75" width="460.5" height="326.5" rx="13.25" fill="none" stroke="#2a2d3a" stroke-width="1.5"/>
  </g>

  <!-- title bar -->
  <circle cx="626" cy="72" r="6" fill="#ff5f57"/>
  <circle cx="647" cy="72" r="6" fill="#febc2e"/>
  <circle cx="668" cy="72" r="6" fill="#28c840"/>
  <text x="1040" y="77" text-anchor="end" font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="13" fill="#6a7182">acme &#183; bust run</text>
  <line x1="600" y1="94" x2="1062" y2="94" stroke="#20232e" stroke-width="1.5"/>

  <!-- terminal content -->
  <g font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="14.5">
    <!-- prompt line -->
    <text x="624" y="126"><tspan fill="#2dd4bf">$</tspan> <tspan fill="#e8eaf0">obliquity bust run acme</tspan></text>
    <!-- stage label -->
    <text x="624" y="156"><tspan fill="#8b93a3">[stage 3/4]</tspan> <tspan fill="#58a6ff">backup-and-config-files</tspan></text>

    <!-- result rows -->
    <text x="640" y="188"><tspan fill="#28c840">200</tspan>   <tspan fill="#c7cdda">/web.config</tspan></text>
    <text x="1040" y="188" text-anchor="end" fill="#5b6272">2.1 kb</text>

    <!-- highlighted high-value finding -->
    <rect x="612" y="200" width="438" height="30" rx="6" fill="#ff8a1e" fill-opacity="0.12"/>
    <rect x="612" y="200" width="3.5" height="30" rx="1.5" fill="#ff8a1e"/>
    <text x="640" y="221"><tspan fill="#28c840">200</tspan>   <tspan fill="#ffb066" font-weight="600">/backup.zip</tspan></text>
    <text x="1040" y="221" text-anchor="end" fill="#ffb066">8.4 mb</text>

    <text x="640" y="253"><tspan fill="#febc2e">301</tspan>   <tspan fill="#c7cdda">/admin/</tspan></text>
    <text x="1040" y="253" text-anchor="end" fill="#5b6272">0 b</text>

    <text x="640" y="285"><tspan fill="#ff7a3c">403</tspan>   <tspan fill="#c7cdda">/api/</tspan></text>
    <text x="1040" y="285" text-anchor="end" fill="#5b6272">0 b</text>
  </g>

  <!-- finding badge -->
  <g font-family="'SFMono-Regular', ui-monospace, Consolas, monospace">
    <rect x="624" y="306" width="268" height="30" rx="15" fill="#1a1206" stroke="#ff8a1e" stroke-width="1.3"/>
    <circle cx="644" cy="321" r="4" fill="#ff8a1e"/>
    <text x="658" y="326" font-size="13" font-weight="700" fill="#ffb066">HIGH-VALUE &#8212; /backup.zip</text>
  </g>
  <text x="624" y="360" font-family="'SFMono-Regular', ui-monospace, Consolas, monospace" font-size="12.5" fill="#6a7182">Staged, resumable, logged to one report.</text>
</svg>
