<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff004c"/>
      <stop offset="20%" stop-color="#ff7a00"/>
      <stop offset="40%" stop-color="#ffe600"/>
      <stop offset="60%" stop-color="#00e676"/>
      <stop offset="80%" stop-color="#00c2ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="bust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ff004c"/>
    </linearGradient>
    <linearGradient id="fuzz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
    <linearGradient id="crack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00c2ff"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="218" rx="17" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text x="450" y="88" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace"
        font-size="52" font-weight="700" letter-spacing="4" fill="url(#rainbow)">OBLIQUITY</text>

  <text x="450" y="118" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace"
        font-size="15" letter-spacing="3" fill="#8b949e">STAGED PENTEST TOOL ORCHESTRATION</text>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700">
    <rect x="180" y="150" width="150" height="40" rx="20" fill="#161b22" stroke="url(#bust)" stroke-width="1.5"/>
    <text x="255" y="175" text-anchor="middle" fill="#ffab5e">bust</text>

    <rect x="375" y="150" width="150" height="40" rx="20" fill="#161b22" stroke="url(#fuzz)" stroke-width="1.5"/>
    <text x="450" y="175" text-anchor="middle" fill="#9d8fff">fuzz</text>

    <rect x="570" y="150" width="150" height="40" rx="20" fill="#161b22" stroke="url(#crack)" stroke-width="1.5"/>
    <text x="645" y="175" text-anchor="middle" fill="#5eead4">crack</text>
  </g>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#6e7681">
    <text x="255" y="205" text-anchor="middle">feroxbuster</text>
    <text x="450" y="205" text-anchor="middle">ffuf</text>
    <text x="645" y="205" text-anchor="middle">hashcat</text>
  </g>
