[project]
name = "obliquity-mvp"
version = "0.1.0"
description = "Obliquity Bust MVP: staged feroxbuster orchestration"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
obliquity = "obliquity.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["obliquity*"]   # ship only the app package, never testlab/ (dev harness)

[tool.setuptools.package-data]
obliquity = ["profiles/*.json", "profiles/*.txt", "fuzz_profiles/*.json", "fuzz_profiles/*.txt", "crack_profiles/*.json", "crack_profiles/*.txt", "login_profiles/*.json", "login_profiles/*.txt"]
